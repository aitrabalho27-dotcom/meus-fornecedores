<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Fornecedores - Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; }
        #appSection { display: none; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginSection" class="fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-black mb-6 text-slate-800">HUB DE FORNECEDORES</h2>
            <input type="password" id="passInput" placeholder="Senha de Acesso" class="w-full p-4 border rounded-xl mb-4 text-center outline-none focus:ring-2 focus:ring-emerald-500 text-lg">
            <button type="button" onclick="validarAcesso()" class="w-full bg-emerald-600 text-white font-bold p-4 rounded-xl hover:bg-emerald-700 transition-all shadow-lg active:scale-95">ENTRAR NO SISTEMA</button>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="appSection" class="min-h-screen bg-gray-100 flex flex-col lg:flex-row">
        <!-- Sidebar -->
        <aside class="w-full lg:w-72 bg-slate-900 text-gray-300 p-6 flex flex-col">
            <h1 class="text-white text-xl font-bold mb-8">Hub de Fornecedores</h1>
            <nav class="space-y-4">
                <button onclick="exportarBackup()" class="w-full text-left p-2 hover:bg-slate-800 rounded">📥 Exportar Backup</button>
                <label class="block p-2 hover:bg-slate-800 rounded cursor-pointer">
                    📤 Importar JSON <input type="file" class="hidden" onchange="importarDados(event)">
                </label>
            </nav>
            <button onclick="location.reload()" class="mt-auto text-gray-500 text-sm hover:text-white">SAIR DO SISTEMA</button>
        </aside>

        <!-- Conteúdo -->
        <main class="flex-1 p-8">
            <div class="bg-white p-6 rounded-2xl shadow mb-8">
                <h3 class="text-xl font-bold mb-4">Novo Fornecedor</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="comp" placeholder="Fornecedor (Ex: Samrello)" class="p-3 border rounded-lg">
                    <input type="text" id="cont" placeholder="Contato" class="p-3 border rounded-lg">
                    <input type="text" id="tel" placeholder="Telefone" class="p-3 border rounded-lg">
                    <input type="email" id="mail" placeholder="E-mail" class="p-3 border rounded-lg">
                    <input type="text" id="mat" placeholder="Especificação do Material" class="p-3 border rounded-lg md:col-span-2">
                </div>
                <button onclick="salvar()" class="mt-4 bg-emerald-500 text-white px-6 py-3 rounded-lg font-bold w-full md:w-auto">CADASTRAR</button>
            </div>

            <div class="bg-white rounded-2xl shadow overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 border-b">
                        <tr class="text-xs uppercase font-bold text-gray-500">
                            <th class="p-4">Empresa</th>
                            <th class="p-4 text-center">E-mail</th>
                            <th class="p-4 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista" class="divide-y"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const SENHA = "526385";
        let db = JSON.parse(localStorage.getItem('db_final_comprador') || '[]');

        function validarAcesso() {
            const digitado = document.getElementById('passInput').value;
            if(digitado === SENHA) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'flex';
                render();
            } else {
                alert("Senha Incorreta!");
            }
        }

        function salvar() {
            const obj = {
                id: Date.now(),
                comp: document.getElementById('comp').value,
                cont: document.getElementById('cont').value,
                tel: document.getElementById('tel').value,
                mail: document.getElementById('mail').value,
                mat: document.getElementById('mat').value
            };
            db.unshift(obj);
            localStorage.setItem('db_final_comprador', JSON.stringify(db));
            limpar();
            render();
        }

        function limpar() {
            document.getElementById('comp').value = '';
            document.getElementById('cont').value = '';
            document.getElementById('tel').value = '';
            document.getElementById('mail').value = '';
            document.getElementById('mat').value = '';
        }

        function render() {
            const lista = document.getElementById('lista');
            lista.innerHTML = db.map(s => `
                <tr>
                    <td class="p-4 font-bold text-slate-800">${s.comp}</td>
                    <td class="p-4 text-center text-blue-500 text-xs italic">${s.mail}</td>
                    <td class="p-4 text-center">
                        <button onclick="excluir(${s.id})" class="text-red-500 font-bold">X</button>
                    </td>
                </tr>
            `).join('');
        }

        function excluir(id) {
            if(confirm('Excluir fornecedor?')) {
                db = db.filter(x => x.id !== id);
                localStorage.setItem('db_final_comprador', JSON.stringify(db));
                render();
            }
        }

        function exportarBackup() {
            const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'fornecedores.json';
            a.click();
        }

        function importarDados(ev) {
            const r = new FileReader();
            r.onload = (e) => {
                const novos = JSON.parse(e.target.result);
                novos.forEach(n => { if(!db.find(x => x.mail === n.mail)) db.push(n); });
                localStorage.setItem('db_final_comprador', JSON.stringify(db));
                render();
                alert('Dados importados!');
            };
            r.readAsText(ev.target.files[0]);
        }
    </script>
</body>
</html>
