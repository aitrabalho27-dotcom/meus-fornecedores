<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Fornecedores - Dark Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* MODO ESCURO GLOBAL */
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        
        .btn-primary { background-color: #10b981; color: white; transition: all 0.2s; }
        .btn-primary:hover { background-color: #34d399; transform: translateY(-1px); }
        
        .btn-secondary { background-color: #334155; color: white; }
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; background: #1e293b; }
        .btn-outline:hover { background: #334155; color: #ffffff; }
        
        /* PADRONIZAÇÃO DAS CAIXAS DE TEXTO (DARK) */
        .input-padrao {
            width: 100%;
            padding: 0.75rem;
            background-color: #334155;
            border: 2px solid #475569;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #f8fafc;
            outline: none;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .input-padrao::placeholder { color: #94a3b8; text-transform: none; }
        .input-padrao:focus {
            border-color: #10b981;
            background-color: #1e293b;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        #i_email { text-transform: lowercase; }

        #appSection { display: none; }
        .contact-icon { font-size: 10px; margin-right: 4px; opacity: 0.8; }
        
        /* Ajuste para a Tabela no Dark Mode */
        thead { background-color: #0f172a; }
        tr:hover { background-color: #334155 !important; }
        .divide-slate-800 > :not([hidden]) ~ :not([hidden]) { border-color: #334155; }
    </style>
</head>
<body>

    <div id="loginSection" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-xl font-black mb-6 text-slate-100 uppercase tracking-tight font-mono">Acesso Restrito</h2>
            <input type="password" id="passInput" placeholder="Digite a Senha" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl mb-4 text-center text-white outline-none focus:ring-2 focus:ring-emerald-500">
            <button onclick="validar()" class="w-full btn-primary font-bold p-4 rounded-xl shadow-lg uppercase">ENTRAR NO HUB</button>
        </div>
    </div>

    <div id="appSection" class="min-h-screen flex flex-col lg:flex-row">
        
        <aside class="w-full lg:w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col shadow-sm">
            <div class="mb-8">
                <h1 class="text-xl font-black text-emerald-500 leading-none uppercase italic">Hub de<br>Fornecedores</h1>
                <p class="text-[10px] font-bold text-slate-500 mt-2 uppercase tracking-widest">Gestão Simplificada</p>
            </div>
            <nav class="flex-1 space-y-2">
                <div class="py-2 border-l-4 border-emerald-500 pl-4 bg-emerald-900/20 mb-6"><span class="text-xs font-bold text-emerald-400">FORNECEDORES</span></div>
                <button onclick="exportar()" class="w-full text-left p-3 text-xs font-semibold text-slate-300 hover:bg-slate-800 rounded-lg flex items-center gap-2">💾 EXPORTAR BACKUP</button>
                <label class="block w-full text-left p-3 text-xs font-semibold text-slate-300 hover:bg-slate-800 rounded-lg cursor-pointer flex items-center gap-2">📂 IMPORTAR DADOS <input type="file" class="hidden" onchange="importar(event)"></label>
            </nav>
            <button onclick="location.reload()" class="mt-auto bg-slate-800 p-3 rounded-xl text-[10px] font-black text-slate-400 hover:bg-red-900/30 hover:text-red-400 transition-all uppercase border border-slate-700">Sair do Sistema</button>
        </aside>

        <main class="flex-1 p-4 lg:p-8 overflow-y-auto">
            <div class="max-w-6xl mx-auto space-y-6">
                
                <div class="card p-6 border-t-4 border-t-emerald-600">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Novo Cadastro / Edição</h3>
                    <input type="hidden" id="editId">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <input type="text" id="i_nome" placeholder="FORNECEDOR" class="input-padrao">
                        <input type="text" id="i_contato" placeholder="CONTATO" class="input-padrao">
                        <input type="text" id="i_email" placeholder="E-MAIL" class="input-padrao">
                        <input type="text" id="i_tel" maxlength="15" onkeyup="mascaraTelefone(this)" placeholder="TELEFONE" class="input-padrao text-emerald-400 font-bold">
                        <div class="md:col-span-2">
                            <input list="materiaisSugeridos" type="text" id="i_mat" autocomplete="off" placeholder="TIPO DE MATERIAL" class="input-padrao">
                            <datalist id="materiaisSugeridos"></datalist>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                        <button onclick="limparCampos()" class="px-6 py-2 text-xs font-bold text-slate-500 uppercase hover:text-slate-300 transition-colors">Limpar</button>
                        <button id="btnSalvar" onclick="cadastrar()" class="btn-primary px-8 py-3 rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg">✅ Salvar Fornecedor</button>
                    </div>
                </div>

                <div class="card p-4 bg-slate-900 border-emerald-900/30">
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-emerald-500">🔍</span>
                        <input type="text" id="i_busca_global" onkeyup="renderizar()" placeholder="DIGITE PARA FILTRAR TUDO..." class="w-full pl-10 p-4 bg-slate-800 border-2 border-slate-700 rounded-xl text-sm font-bold text-emerald-400 outline-none focus:border-emerald-500 transition-all uppercase placeholder:text-slate-600 shadow-inner">
                    </div>
                </div>

                <div class="card overflow-hidden">
                    <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 sticky top-0 z-10">
                        <div class="flex items-center gap-3">
                            <h2 class="font-black text-slate-100 text-xs uppercase tracking-tight">Fornecedores</h2>
                            <span id="contador" class="text-[10px] bg-emerald-950 px-2 py-1 rounded text-emerald-400 font-bold border border-emerald-900/50">0 ENCONTRADOS</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="iniciarEdicao()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-orange-400 hover:border-orange-400">🖊️ EDITAR</button>
                            <button onclick="removerSelecionados()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-red-400 hover:border-red-400">🗑️ EXCLUIR</button>
                            <button onclick="copiarEmails()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-emerald-400 hover:border-emerald-500">📋 E-MAILS</button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="text-[10px] font-black text-slate-500 uppercase tracking-tighter border-b border-slate-800">
                                <tr>
                                    <th class="p-4 w-12 text-center"><input type="checkbox" onclick="selecionarTodos(this)" class="accent-emerald-500"></th>
                                    <th class="p-4">Fornecedor</th>
                                    <th class="p-4 text-center">Contato / E-mail / Tel</th>
                                    <th class="p-4">Material</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaBody" class="divide-y divide-slate-800 text-[11px]"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let baseDados = JSON.parse(localStorage.getItem('db_hub_compras') || '[]');

        function validar() {
            if(document.getElementById('passInput').value === "526385") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'flex';
                renderizar();
            } else { alert("Senha incorreta"); }
        }

        function mascaraTelefone(input) {
            let v = input.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d{5})(\d)/, "$1-$2");
            input.value = v;
        }

        function atualizarSugestoes() {
            const datalist = document.getElementById('materiaisSugeridos');
            const materiaisUnicos = [...new Set(baseDados.map(f => f.material.trim().toUpperCase()).filter(m => m !== ""))];
            datalist.innerHTML = ""; 
            materiaisUnicos.forEach(m => {
                const option = document.createElement('option');
                option.value = m;
                datalist.appendChild(option);
            });
        }

        function cadastrar() {
            const nome = document.getElementById('i_nome').value.trim();
            const editId = document.getElementById('editId').value;
            if(!nome) return alert("O nome é obrigatório!");

            const dados = {
                id: editId ? Number(editId) : Date.now(),
                nome: nome.toUpperCase(),
                contato: document.getElementById('i_contato').value.toUpperCase(),
                email: document.getElementById('i_email').value.toLowerCase(),
                tel: document.getElementById('i_tel').value,
                material: document.getElementById('i_mat').value.toUpperCase()
            };

            if(editId) {
                const index = baseDados.findIndex(f => f.id === dados.id);
                if(index !== -1) baseDados[index] = dados;
            } else { baseDados.unshift(dados); }

            localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
            limparCampos();
            renderizar();
        }

        function renderizar() {
            const termo = document.getElementById('i_busca_global').value.toLowerCase();
            const container = document.getElementById('tabelaBody');
            
            const filtrados = baseDados.filter(f => 
                f.nome.toLowerCase().includes(termo) ||
                f.contato.toLowerCase().includes(termo) ||
                f.email.toLowerCase().includes(termo) ||
                f.tel.toLowerCase().includes(termo) ||
                f.material.toLowerCase().includes(termo)
            );
            
            document.getElementById('contador').innerText = `${filtrados.length} ENCONTRADOS`;

            container.innerHTML = filtrados.map(f => `
                <tr class="hover:bg-slate-800 transition-colors border-b border-slate-800">
                    <td class="p-4 text-center"><input type="checkbox" class="chk-item accent-emerald-500" value="${f.id}"></td>
                    <td class="p-4 font-black text-slate-100 uppercase tracking-tight">${f.nome}</td>
                    <td class="p-4 text-center">
                        <div class="font-bold text-slate-300 flex items-center justify-center"><span class="contact-icon">👤</span> ${f.contato}</div>
                        <div class="text-[11px] text-blue-400 font-medium my-0.5"><span class="contact-icon">✉️</span> ${f.email}</div>
                        <div class="font-bold text-emerald-400"><span class="contact-icon">📞</span> ${f.tel}</div>
                    </td>
                    <td class="p-4 italic font-medium text-slate-400 uppercase">${f.material}</td>
                </tr>
            `).join('');
            atualizarSugestoes();
        }

        function limparCampos() {
            ['i_nome', 'i_contato', 'i_email', 'i_tel', 'i_mat', 'editId', 'i_busca_global'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).value = '';
            });
            document.getElementById('btnSalvar').innerText = "✅ Salvar Fornecedor";
            renderizar();
        }

        function iniciarEdicao() {
            const chk = document.querySelector('.chk-item:checked');
            if(!chk) return alert("Selecione um item!");
            const item = baseDados.find(f => f.id == chk.value);
            if(item) {
                document.getElementById('editId').value = item.id;
                document.getElementById('i_nome').value = item.nome;
                document.getElementById('i_contato').value = item.contato;
                document.getElementById('i_email').value = item.email;
                document.getElementById('i_tel').value = item.tel;
                document.getElementById('i_mat').value = item.material;
                document.getElementById('btnSalvar').innerText = "💾 Salvar Alterações";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function selecionarTodos(source) {
            document.querySelectorAll('.chk-item').forEach(c => c.checked = source.checked);
        }

        function copiarEmails() {
            const sel = Array.from(document.querySelectorAll('.chk-item:checked')).map(c => baseDados.find(f => f.id == c.value)?.email).filter(e => e);
            const texto = sel.length ? sel.join('; ') : baseDados.map(f => f.email).filter(e => e).join('; ');
            navigator.clipboard.writeText(texto);
            alert("E-mails copiados!");
        }

        function removerSelecionados() {
            const sel = Array.from(document.querySelectorAll('.chk-item:checked')).map(c => Number(c.value));
            if(!sel.length || !confirm(`Excluir ${sel.length} item(ns)?`)) return;
            baseDados = baseDados.filter(f => !sel.includes(f.id));
            localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
            renderizar();
        }

        function exportar() {
            const blob = new Blob([JSON.stringify(baseDados, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `HUB_BACKUP_DARK.json`;
            a.click();
        }

        function importar(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const dados = JSON.parse(ev.target.result);
                    baseDados = [...dados, ...baseDados.filter(b => !dados.find(d => d.id === b.id))];
                    localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
                    renderizar();
                    alert("Importado!");
                } catch(err) { alert("Erro no arquivo!"); }
            };
            reader.readAsText(e.target.files[0]);
        }
    </script>
</body>
</html>
