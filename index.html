<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Fornecedores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        #loginSection { background-color: #0f172a; position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 1rem; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="loginSection">
        <div class="card">
            <h2 style="font-weight: 900; margin-bottom: 1.5rem; color: #1e293b;">HUB DE FORNECEDORES</h2>
            <input type="password" id="passInput" placeholder="Senha de Acesso" 
                   style="width: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 0.5rem; margin-bottom: 1rem; text-align: center; font-size: 1.2rem;">
            
            <button type="button" onclick="validarAcesso()" 
                    style="width: 100%; background: #10b981; color: white; font-weight: bold; padding: 1rem; border: none; border-radius: 0.5rem; cursor: pointer;">
                ENTRAR NO SISTEMA
            </button>
        </div>
    </div>

    <!-- SISTEMA -->
    <div id="appSection" style="display: none; padding: 20px;">
        <h1 style="font-weight: 900;">Painel de Gestão</h1>
        <p>Acesso liberado com sucesso.</p>
        <button onclick="location.reload()" style="background: #ef4444; color: white; padding: 10px; border-radius: 5px; border: none; cursor: pointer;">SAIR</button>
        
        <div style="margin-top: 20px; border: 1px solid #ddd; padding: 20px; border-radius: 10px; background: white;">
            <p><strong>Aguardando dados...</strong></p>
            <p>Use o formulário abaixo para cadastrar seu primeiro fornecedor.</p>
        </div>
    </div>

    <script>
        function validarAcesso() {
            // Pegamos o valor direto do campo no momento do clique
            var campoSenha = document.getElementById('passInput');
            var senhaDigitada = campoSenha.value;
            
            console.log("Tentativa de login iniciada..."); // Isso aparece no F12

            if (senhaDigitada === "526385") {
                // Comando direto para esconder e mostrar
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'block';
            } else {
                alert("Senha incorreta! Verifique os números.");
                campoSenha.value = ""; // Limpa o campo
                campoSenha.focus();    // Devolve o cursor para o campo
            }
        }

        // Permite entrar apertando a tecla ENTER
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                validarAcesso();
            }
        });
    </script>
</body>
</html>
