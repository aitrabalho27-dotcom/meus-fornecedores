<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Fornecedores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4">Hub de Fornecedores</h1>
        <div class="flex gap-4 mb-6">
            <button onclick="exportar()" class="bg-blue-500 text-white px-4 py-2 rounded">Exportar Backup</button>
            <input type="file" id="importFile" class="hidden" onchange="importar(event)">
            <button onclick="document.getElementById('importFile').click()" class="bg-amber-500 text-white px-4 py-2 rounded">Importar e Somar</button>
        </div>
        <form id="f" class="grid gap-2 mb-8">
            <input id="n" placeholder="Empresa" class="border p-2 rounded" required>
            <input id="e" type="email" placeholder="E-mail" class="border p-2 rounded" required>
            <button type="submit" class="bg-emerald-600 text-white p-2 rounded font-bold">Salvar</button>
        </form>
        <table class="w-full text-left border-collapse">
            <thead><tr class="bg-gray-100"><th class="p-2 border">Empresa</th><th class="p-2 border">E-mail</th></tr></thead>
            <tbody id="lista"></tbody>
        </div>
    </div>
    <script>
        let dados = JSON.parse(localStorage.getItem('db_forn') || '[]');
        const render = () => {
            document.getElementById('lista').innerHTML = dados.map(s => <tr><td class="p-2 border">${s.n}</td><td class="p-2 border">${s.e}</td></tr>).join('');
        };
        document.getElementById('f').onsubmit = (e) => {
            e.preventDefault();
            dados.push({n: document.getElementById('n').value, e: document.getElementById('e').value});
            localStorage.setItem('db_forn', JSON.stringify(dados));
            render(); e.target.reset();
        };
        function exportar() {
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dados));
            a.download = "fornecedores.json"; a.click();
        }
        function importar(ev) {
            const r = new FileReader();
            r.onload = (e) => {
                const novos = JSON.parse(e.target.result);
                novos.forEach(n => { if(!dados.find(d => d.e === n.e)) dados.push(n); });
                localStorage.setItem('db_forn', JSON.stringify(dados)); render();
                alert('Dados somados com sucesso!');
            };
            r.readAsText(ev.target.files[0]);
        }
        render();
    </script>
</body>
</html>
