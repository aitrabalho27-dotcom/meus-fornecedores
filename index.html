<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Fornecedores - Base Única v4.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        
        .btn-primary { background-color: #10b981; color: white; transition: all 0.2s; }
        .btn-primary:hover { background-color: #34d399; transform: translateY(-1px); }
        
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; background: #1e293b; transition: all 0.2s; }
        .btn-outline:hover { background: #334155; color: #ffffff; border-color: #64748b; }
        
        .input-padrao {
            width: 100%; padding: 0.75rem; background-color: #334155; border: 2px solid #475569;
            border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; color: #f8fafc;
            outline: none; transition: all 0.2s; text-transform: uppercase;
        }
        .input-padrao:focus { border-color: #10b981; background-color: #1e293b; }
        #i_email { text-transform: lowercase; }

        /* Estilo para preservar as quebras de linha nas descrições elaboradas */
        .text-descricao { color: #94a3b8; line-height: 1.5; white-space: pre-wrap; font-size: 11px; }

        .sticky-header-group {
            position: sticky; top: 0; z-index: 100;
            background-color: #0f172a; padding-top: 10px;
        }

        .inner-sticky {
            background-color: #1e293b; border: 1px solid #334155;
            border-radius: 12px 12px 0 0; border-bottom: 2px solid #0f172a;
        }

        .data-table-container {
            background-color: #1e293b; border: 1px solid #334155;
            border-top: none; border-radius: 0 0 12px 12px;
        }

        tr:hover { background-color: #26334d !important; }
        .td-nome { font-weight: 800; color: #f1f5f9; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="loginSection" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-950 p-4">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-xl font-black mb-6 text-slate-100 uppercase tracking-tight">Acesso Restrito</h2>
            <input type="password" id="passInput" placeholder="Senha" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl mb-4 text-center text-white outline-none">
            <button onclick="validar()" class="w-full btn-primary font-bold p-4 rounded-xl shadow-lg uppercase">ENTRAR</button>
        </div>
    </div>

    <div id="appSection" class="min-h-screen flex flex-col lg:flex-row">
        
        <aside class="w-full lg:w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col">
            <h1 class="text-xl font-black text-emerald-500 uppercase italic mb-8">Hub de<br>Fornecedores</h1>
            <nav class="flex-1 space-y-2 text-xs font-semibold">
                <button onclick="exportar()" class="w-full text-left p-3 text-slate-300 hover:bg-slate-800 rounded-lg">💾 EXPORTAR BACKUP</button>
                <label class="block w-full text-left p-3 text-slate-300 hover:bg-slate-800 rounded-lg cursor-pointer">📂 IMPORTAR DADOS <input type="file" class="hidden" onchange="importar(event)"></label>
            </nav>
            <button onclick="location.reload()" class="mt-auto bg-slate-800 p-3 rounded-xl text-[10px] font-black text-slate-400 uppercase">Sair</button>
        </aside>

        <main class="flex-1 p-4 lg:p-8">
            <div class="max-w-6xl mx-auto space-y-6">
                
                <div class="card p-6 border-t-4 border-t-emerald-600">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Cadastro Estruturado (Base Única)</h3>
                    <input type="hidden" id="editId">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <input type="text" id="i_nome" placeholder="NOME DO FORNECEDOR" class="input-padrao">
                        <input type="text" id="i_contato" placeholder="VENDEDOR / CONTATO" class="input-padrao">
                        <input type="text" id="i_email" placeholder="E-MAIL" class="input-padrao">
                        <input type="text" id="i_tel" maxlength="15" onkeyup="mascaraTelefone(this)" placeholder="TELEFONE" class="input-padrao text-emerald-400">
                        <div class="md:col-span-2">
                            <textarea id="i_mat" placeholder="DESCRIÇÃO TÉCNICA E MATERIAIS..." class="input-padrao h-12 py-3" style="text-transform: uppercase;"></textarea>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                        <button onclick="limparCampos()" class="px-6 py-2 text-xs font-bold text-slate-500 uppercase">Limpar</button>
                        <button id="btnSalvar" onclick="cadastrar()" class="btn-primary px-8 py-3 rounded-xl font-bold text-xs uppercase shadow-lg">✅ Salvar Registro</button>
                    </div>
                </div>

                <div class="card p-4 bg-slate-900 border-emerald-900/30">
                    <input type="text" id="i_busca_global" onkeyup="renderizar()" placeholder="PESQUISA GLOBAL (NOME, MATERIAL OU E-MAIL)..." class="w-full p-4 bg-slate-800 border-2 border-slate-700 rounded-xl text-sm font-bold text-emerald-400 outline-none uppercase shadow-inner">
                </div>

                <div class="sticky-header-group">
                    <div class="inner-sticky">
                        <div class="p-4 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <h2 class="font-black text-slate-100 text-xs uppercase">Base de Fornecedores</h2>
                                <span id="contador" class="text-[10px] bg-emerald-950 px-2 py-1 rounded text-emerald-400 font-bold border border-emerald-900/50">0</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="iniciarEdicao()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-orange-400">🖊️ EDITAR</button>
                                <button onclick="removerSelecionados()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-red-400">🗑️ EXCLUIR</button>
                                <button onclick="copiarEmails()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-emerald-400">📋 COPIAR E-MAILS</button>
                            </div>
                        </div>
                        <table class="w-full text-left border-t border-slate-700">
                            <thead class="text-[10px] font-black text-slate-500 uppercase bg-slate-800/50">
                                <tr>
                                    <th class="p-4 w-12 text-center"><input type="checkbox" onclick="selecionarTodos(this)" class="accent-emerald-500"></th>
                                    <th class="p-4 w-1/4">Fornecedor</th>
                                    <th class="p-4 w-1/4 text-center">Contato</th>
                                    <th class="p-4">Descrição Técnica / Materiais</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>

                <div class="data-table-container overflow-x-auto">
                    <table class="w-full text-left">
                        <tbody id="tabelaBody" class="divide-y divide-slate-800 text-[11px]"></tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script>
        let baseDados = JSON.parse(localStorage.getItem('db_hub_compras') || '[]');

        function validar() {
            if(document.getElementById('passInput').value === "526385") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'flex';
                renderizar();
            } else { alert("Senha incorreta"); }
        }

        function mascaraTelefone(input) {
            let v = input.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d{5})(\d)/, "$1-$2");
            input.value = v;
        }

        // Função de cadastro com verificação de duplicidade Nome+Email+Tel
        function cadastrar() {
            const nome = document.getElementById('i_nome').value.trim().toUpperCase();
            const contato = document.getElementById('i_contato').value.trim().toUpperCase();
            const email = document.getElementById('i_email').value.trim().toLowerCase();
            const tel = document.getElementById('i_tel').value.trim();
            const mat = document.getElementById('i_mat').value.trim().toUpperCase();
            const editId = document.getElementById('editId').value;

            if(!nome) return alert("O Nome é obrigatório!");

            // Proteção contra duplicados (apenas se for novo cadastro)
            if (!editId) {
                const jaExiste = baseDados.find(f => 
                    f.nome === nome && f.email === email && f.tel === tel
                );
                if (jaExiste) return alert("Atenção: Este fornecedor já está cadastrado com este e-mail e telefone.");
            }

            const registro = {
                id: editId ? Number(editId) : Date.now(),
                nome, contato, email, tel, material: mat
            };

            if(editId) {
                const index = baseDados.findIndex(f => f.id === registro.id);
                if(index !== -1) baseDados[index] = registro;
            } else {
                baseDados.unshift(registro);
            }

            localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
            limparCampos();
            renderizar();
        }

        function renderizar() {
            const termo = document.getElementById('i_busca_global').value.toLowerCase();
            const container = document.getElementById('tabelaBody');
            const filtrados = baseDados.filter(f => 
                f.nome.toLowerCase().includes(termo) || 
                f.material.toLowerCase().includes(termo) ||
                f.email.toLowerCase().includes(termo) ||
                f.tel.includes(termo)
            );

            document.getElementById('contador').innerText = `${filtrados.length} REGISTROS`;
            
            container.innerHTML = filtrados.map(f => `
                <tr class="hover:bg-slate-800">
                    <td class="p-4 text-center w-12"><input type="checkbox" class="chk-item accent-emerald-500" value="${f.id}"></td>
                    <td class="p-4 td-nome w-1/4">${f.nome}</td>
                    <td class="p-4 text-center w-1/4">
                        <div class="font-bold text-slate-300 uppercase">${f.contato}</div>
                        <div class="text-blue-400 font-medium">${f.email}</div>
                        <div class="text-emerald-400 font-black">${f.tel}</div>
                    </td>
                    <td class="p-4 text-descricao">${f.material}</td>
                </tr>
            `).join('');
        }

        // Importação inteligente: ignora itens que já existem (Nome+Email+Tel)
        function importar(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const dadosImportados = JSON.parse(ev.target.result);
                    let contNovos = 0;
                    dadosImportados.forEach(itemImp => {
                        const duplicado = baseDados.find(f => 
                            f.nome.toUpperCase() === itemImp.nome.toUpperCase() && 
                            f.email.toLowerCase() === itemImp.email.toLowerCase() && 
                            f.tel === itemImp.tel
                        );
                        if(!duplicado) {
                            baseDados.push(itemImp);
                            contNovos++;
                        }
                    });
                    localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
                    renderizar();
                    alert(`${contNovos} novos registros importados. Duplicados foram ignorados.`);
                } catch { alert("Erro ao ler o arquivo JSON."); }
            };
            reader.readAsText(e.target.files[0]);
        }

        function limparCampos() {
            ['i_nome', 'i_contato', 'i_email', 'i_tel', 'i_mat', 'editId', 'i_busca_global'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('btnSalvar').innerText = "✅ Salvar Registro";
            renderizar();
        }

        function exportar() {
            const blob = new Blob([JSON.stringify(baseDados, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `BASE_FORNECEDORES_UNICA.json`;
            a.click();
        }

        function iniciarEdicao() {
            const chk = document.querySelector('.chk-item:checked');
            if(!chk) return alert("Selecione um item!");
            const item = baseDados.find(f => f.id == chk.value);
            if(item) {
                document.getElementById('editId').value = item.id;
                document.getElementById('i_nome').value = item.nome;
                document.getElementById('i_contato').value = item.contato;
                document.getElementById('i_email').value = item.email;
                document.getElementById('i_tel').value = item.tel;
                document.getElementById('i_mat').value = item.material;
                document.getElementById('btnSalvar').innerText = "💾 Salvar Alterações";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function selecionarTodos(s) { document.querySelectorAll('.chk-item').forEach(c => c.checked = s.checked); }
        
        function removerSelecionados() {
            const sel = Array.from(document.querySelectorAll('.chk-item:checked')).map(c => Number(c.value));
            if(!sel.length || !confirm("Excluir selecionados?")) return;
            baseDados = baseDados.filter(f => !sel.includes(f.id));
            localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
            renderizar();
        }

        function copiarEmails() {
            const sel = Array.from(document.querySelectorAll('.chk-item:checked')).map(c => baseDados.find(f => f.id == c.value)?.email).filter(e => e);
            const emails = sel.length ? sel.join('; ') : baseDados.map(f => f.email).filter(e => e).join('; ');
            if(!emails) return alert("Nenhum e-mail para copiar.");
            navigator.clipboard.writeText(emails).then(() => alert("E-mails copiados!"));
        }
    </script>
</body>
</html>
