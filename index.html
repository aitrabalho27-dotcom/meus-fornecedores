<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Fornecedores - Dark Mode v4.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        
        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; transition: all 0.2s; border-radius: 0.75rem; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .btn-outline { border: 1px solid #475569; color: #cbd5e1; background: #1e293b; transition: all 0.2s; }
        .btn-outline:hover { background: #334155; color: #ffffff; border-color: #64748b; }
        
        .input-padrao {
            width: 100%; padding: 0.75rem; background-color: #334155; border: 2px solid #475569;
            border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; color: #f8fafc;
            outline: none; transition: all 0.2s; text-transform: uppercase;
        }
        .input-padrao:focus { border-color: #10b981; background-color: #1e293b; }
        #i_email { text-transform: lowercase; }

        .sticky-header-group { position: sticky; top: 0; z-index: 100; background-color: #0f172a; padding-top: 10px; }
        .inner-sticky { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px 12px 0 0; border-bottom: 2px solid #0f172a; }
        .data-table-container { background-color: #1e293b; border: 1px solid #334155; border-top: none; border-radius: 0 0 12px 12px; }

        tr:hover { background-color: #334155 !important; }
        .td-nome { font-weight: 700; color: #f1f5f9; text-transform: uppercase; padding: 1rem; }
        
        /* AJUSTE DE ALINHAMENTO DO CONTATO */
        .td-contato { font-weight: 500; color: #cbd5e1; padding: 1rem; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
        .contact-line { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; width: 100%; }
        
        .td-material { font-weight: 500; color: #94a3b8; text-transform: uppercase; padding: 1rem; white-space: pre-wrap; font-size: 11px; }
        .contact-icon { font-size: 11px; width: 14px; text-align: center; }

        textarea.input-padrao { min-height: 80px; resize: vertical; }
    </style>
</head>
<body>

    <div id="loginSection" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-950 p-4">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-xl font-black mb-6 text-slate-100 uppercase tracking-tight">Acesso Restrito</h2>
            <input type="password" id="passInput" placeholder="Senha" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl mb-4 text-center text-white outline-none">
            <button onclick="validar()" class="w-full btn-primary font-bold p-4 shadow-lg uppercase">ENTRAR</button>
        </div>
    </div>

    <div id="appSection" class="min-h-screen flex flex-col lg:flex-row" style="display:none">
        
        <aside class="w-full lg:w-64 bg-slate-900 border-r border-slate-800 p-6 flex flex-col">
            <h1 class="text-xl font-black text-emerald-500 uppercase italic mb-8">Hub de<br>Fornecedores</h1>
            <nav class="space-y-2 text-xs font-semibold">
                <button onclick="exportar()" class="w-full text-left p-3 text-slate-300 hover:bg-slate-800 rounded-lg">💾 EXPORTAR BACKUP</button>
                <label class="block w-full text-left p-3 text-slate-300 hover:bg-slate-800 rounded-lg cursor-pointer">📂 IMPORTAR DADOS <input type="file" class="hidden" onchange="importar(event)"></label>
                <button onclick="location.reload()" class="w-full text-left p-3 text-red-400 bg-red-950/20 hover:bg-red-900/30 rounded-lg mt-4 uppercase font-black italic">🚪 Sair do Sistema</button>
            </nav>
            <div class="mt-auto p-4 bg-slate-800/30 rounded-xl border border-slate-800">
                <p class="text-[9px] text-slate-500 font-bold uppercase text-center">Controle de Compras v4.5</p>
            </div>
        </aside>

        <main class="flex-1 p-4 lg:p-8">
            <div class="max-w-6xl mx-auto space-y-6">
                
                <div class="card p-6 border-t-4 border-t-emerald-600">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Painel de Registro</h3>
                    <input type="hidden" id="editId">
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <input type="text" id="i_nome" placeholder="NOME DO FORNECEDOR" class="input-padrao">
                        <input type="text" id="i_contato" placeholder="VENDEDOR / CONTATO" class="input-padrao">
                        <input type="text" id="i_email" placeholder="E-MAIL" class="input-padrao">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mb-4">
                        <div class="md:col-span-3">
                            <input type="text" id="i_tel" maxlength="15" onkeyup="mascaraTelefone(this)" placeholder="TELEFONE" class="input-padrao text-emerald-400">
                        </div>
                        <div class="md:col-span-9 space-y-2">
                            <input list="listaMateriais" id="i_sugestao" placeholder="BUSCAR MATERIAIS JÁ CADASTRADOS..." class="input-padrao bg-slate-800 border-dashed text-[11px] h-10" oninput="if(this.value) { document.getElementById('i_mat').value = this.value.toUpperCase(); }">
                            <datalist id="listaMateriais"></datalist>
                            <textarea id="i_mat" placeholder="DESCRIÇÃO TÉCNICA DOS MATERIAIS..." class="input-padrao"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                        <button onclick="limparCampos()" class="px-6 py-2 text-xs font-bold text-slate-400 hover:text-emerald-400 uppercase transition-colors">Limpar Tudo</button>
                        <button id="btnSalvar" onclick="cadastrar()" class="btn-primary px-8 py-3 font-bold text-xs uppercase shadow-lg">✅ Salvar Registro</button>
                    </div>
                </div>

                <div class="card p-4 bg-slate-900 border-emerald-900/30">
                    <input type="text" id="i_busca_global" onkeyup="renderizar()" placeholder="PESQUISA RÁPIDA..." class="w-full p-4 bg-slate-800 border-2 border-slate-700 rounded-xl text-sm font-bold text-emerald-400 outline-none uppercase shadow-inner">
                </div>

                <div class="sticky-header-group">
                    <div class="inner-sticky">
                        <div class="p-4 flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <h2 class="font-black text-slate-100 text-xs uppercase">Base de Dados</h2>
                                <span id="contador" class="text-[10px] bg-emerald-950 px-2 py-1 rounded text-emerald-400 font-bold border border-emerald-900/50">0 ITENS</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="iniciarEdicao()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-orange-400">🖊️ EDITAR</button>
                                <button onclick="removerSelecionados()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-red-400">🗑️ EXCLUIR</button>
                                <button onclick="copiarEmails()" class="btn-outline px-3 py-2 rounded-lg text-[10px] font-bold text-emerald-400">📋 COPIAR E-MAILS</button>
                            </div>
                        </div>
                        <table class="w-full text-left border-t border-slate-700">
                            <thead class="text-[10px] font-black text-slate-500 uppercase bg-slate-800/50">
                                <tr>
                                    <th class="p-4 w-12 text-center"><input type="checkbox" onclick="selecionarTodos(this)" class="accent-emerald-500"></th>
                                    <th class="p-4 w-1/4">Fornecedor</th>
                                    <th class="p-4 w-1/3">Contato Detalhado</th>
                                    <th class="p-4">Material / Descrição</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>

                <div class="data-table-container overflow-x-auto">
                    <table class="w-full text-left">
                        <tbody id="tabelaBody" class="divide-y divide-slate-800 text-[11px]"></tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script>
        let baseDados = JSON.parse(localStorage.getItem('db_hub_compras') || '[]');

        function validar() {
            if(document.getElementById('passInput').value === "526385") {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'flex';
                renderizar();
            } else { alert("Acesso negado"); }
        }

        function mascaraTelefone(input) {
            let v = input.value.replace(/\D/g, "");
            v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
            v = v.replace(/(\d{5})(\d)/, "$1-$2");
            input.value = v;
        }

        function cadastrar() {
            const nome = document.getElementById('i_nome').value.trim().toUpperCase();
            const email = document.getElementById('i_email').value.trim().toLowerCase();
            const tel = document.getElementById('i_tel').value.trim();
            const editId = document.getElementById('editId').value;

            if(!nome) return alert("Preencha o nome!");

            const registro = {
                id: editId ? Number(editId) : Date.now(),
                nome,
                contato: document.getElementById('i_contato').value.toUpperCase(),
                email,
                tel,
                material: document.getElementById('i_mat').value.toUpperCase()
            };

            if(editId) {
                const idx = baseDados.findIndex(f => f.id === registro.id);
                if(idx !== -1) baseDados[idx] = registro;
            } else { baseDados.unshift(registro); }

            localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
            limparCampos();
        }

        function renderizar() {
            const termo = document.getElementById('i_busca_global').value.toLowerCase();
            const container = document.getElementById('tabelaBody');
            const filtrados = baseDados.filter(f => 
                f.nome.toLowerCase().includes(termo) || f.material.toLowerCase().includes(termo) || f.email.toLowerCase().includes(termo) || f.contato.toLowerCase().includes(termo)
            );

            document.getElementById('contador').innerText = `${filtrados.length} REGISTROS`;
            
            container.innerHTML = filtrados.map(f => `
                <tr class="hover:bg-slate-800">
                    <td class="p-4 text-center w-12"><input type="checkbox" class="chk-item accent-emerald-500" value="${f.id}"></td>
                    <td class="p-4 td-nome">${f.nome}</td>
                    <td class="p-4 td-contato">
                        <div class="contact-line"><span class="contact-icon">👤</span> ${f.contato}</div>
                        <div class="contact-line text-blue-400 text-[10px]"><span class="contact-icon">✉️</span> ${f.email}</div>
                        <div class="contact-line text-emerald-400 font-bold"><span class="contact-icon">📞</span> ${f.tel}</div>
                    </td>
                    <td class="p-4 td-material">${f.material}</td>
                </tr>
            `).join('');

            const dl = document.getElementById('listaMateriais');
            const mats = [...new Set(baseDados.map(f => f.material.split('\n')[0].trim()))].filter(m => m.length > 1).sort();
            dl.innerHTML = mats.map(m => `<option value="${m}">`).join('');
        }

        function limparCampos() {
            ['i_nome', 'i_contato', 'i_email', 'i_tel', 'i_mat', 'i_sugestao', 'editId', 'i_busca_global'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.value = '';
            });
            document.getElementById('btnSalvar').innerText = "✅ Salvar Registro";
            renderizar(); // Chamado aqui para limpar a pesquisa rápida junto
        }

        function iniciarEdicao() {
            const chk = document.querySelector('.chk-item:checked');
            if(!chk) return alert("Selecione um item!");
            const item = baseDados.find(f => f.id == chk.value);
            if(item) {
                document.getElementById('editId').value = item.id;
                document.getElementById('i_nome').value = item.nome;
                document.getElementById('i_contato').value = item.contato;
                document.getElementById('i_email').value = item.email;
                document.getElementById('i_tel').value = item.tel;
                document.getElementById('i_mat').value = item.material;
                document.getElementById('btnSalvar').innerText = "💾 Atualizar Registro";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function selecionarTodos(s) { document.querySelectorAll('.chk-item').forEach(c => c.checked = s.checked); }
        function removerSelecionados() {
            const sel = Array.from(document.querySelectorAll('.chk-item:checked')).map(c => Number(c.value));
            if(!sel.length || !confirm("Remover selecionados?")) return;
            baseDados = baseDados.filter(f => !sel.includes(f.id));
            localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
            renderizar();
        }
        function copiarEmails() {
            const sel = Array.from(document.querySelectorAll('.chk-item:checked')).map(c => baseDados.find(f => f.id == c.value)?.email).filter(e => e);
            const emails = sel.length ? sel.join('; ') : baseDados.map(f => f.email).filter(e => e).join('; ');
            if(emails) navigator.clipboard.writeText(emails).then(() => alert("E-mails copiados!"));
        }
        function exportar() {
            const blob = new Blob([JSON.stringify(baseDados, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `HUB_BACKUP.json`;
            a.click();
        }
        function importar(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const novos = JSON.parse(ev.target.result);
                    novos.forEach(n => { if(!baseDados.find(b => b.nome === n.nome && b.email === n.email)) baseDados.push(n); });
                    localStorage.setItem('db_hub_compras', JSON.stringify(baseDados));
                    renderizar();
                } catch { alert("Erro no arquivo!"); }
            };
            reader.readAsText(e.target.files[0]);
        }
    </script>
</body>
</html>
